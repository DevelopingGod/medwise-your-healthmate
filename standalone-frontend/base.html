<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="style.css">

<head>
    <meta charset="UTF-8">
    <title>MedWise: Your Healthmate</title>
    <link rel="shortcut icon" href="/static/images/favicon.ico">
</head>
<body>
    
<div class="container">

    <div class="chatbox">
        <div class="chatbox__support">
            <div class="chatbox__header">
                <div class="chatbox__image--header">
                    <img src="https://img.icons8.com/external-flatart-icons-outline-flatarticons/64/FFFFFF/external-bot-space-exploration-and-next-big-things-flatart-icons-outline-flatarticons-1.png" alt="image">
                </div>
                <div class="chatbox__content--header">
                    <h4 class="chatbox__heading--header">MedWise: </h4>
                    <h4 class="chatbox__heading--header">Your Healthmate </h4>
                    <p class="chatbox__description--header">I can assist you with your medical problems!</p>
                </div>
            </div>
            <div class="chatbox__messages">
                <h4 style="margin-bottom: 200px; display:flex; flex-wrap:hard;">Enter 'options' to see what symptoms I can address to...</h4>
                <div></div>
            </div>
            <div class="chatbox__footer">
                <input type="text" placeholder="Write a message...">
                <button style="font-weight: bolder ;font-size: 20px ;color: blueviolet; background: white; border-radius: 12px;"class="chatbox__send--footer send__button">Send</button>
            </div>
        </div>
        <div class="chatbox__button">
            <button><img src="./images/chatbox-icon.svg" /></button>
        </div>
    </div>
</div>

    <script src="./app.js"></script>

</body>
</html>
